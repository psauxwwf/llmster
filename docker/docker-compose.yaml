x-llmster: &llmster
  container_name: llmster
  hostname: llmster
  restart: unless-stopped
  platform: linux/amd64
  environment:
    LMS_MUST_PULL: ${LMS_MUST_PULL:-"https://huggingface.co/HauhauCS/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive https://huggingface.co/lmstudio-community/Qwen3.5-2B-GGUF"}
    LMS_UPDATE: ${LMS_UPDATE:-true}
    LMS_CONTEXT: ${LMS_CONTEXT:-16132}
  volumes:
    - ${LMS_MODELS_DIR:-./data/models}:/root/.lmstudio/models/
    - ${LMS_EXTENSIONS_DIR:-./data/extensions}:/root/.lmstudio/extensions/
    - ${LMS_INTERNAL_DIR:-./data/internal}:/root/.lmstudio/.internal/
  ports:
    - 127.0.0.1:1234:1234/tcp
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1234/v1/models"]
    interval: 1m
    timeout: 10s
    start_period: 1m
    retries: 3

services:
  llmster:
    <<: *llmster
    image: ghcr.io/psauxwwf/llmster:cpu
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA: "0"
        LMS_INSTALL_HOME: /root
