x-llmster: &llmster
  container_name: llmster
  hostname: llmster
  restart: unless-stopped
  platform: linux/amd64
  entrypoint: ["sh", "-lc"]
  command:
    [
      "/root/.lmstudio/bin/lms server start --bind 0.0.0.0 && exec /root/.lmstudio/bin/lms log stream --source server",
    ]
  volumes:
    - ./data/lmstudio-models:/root/.cache/lm-studio/models
  ports:
    - 127.0.0.1:1234:1234/tcp
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1234/v1/models"]
    interval: 1m
    timeout: 10s
    start_period: 1m
    retries: 3

services:
  llmster:
    profiles: ["cpu"]
    <<: *llmster
    image: lmstudio-llmster:cpu
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA: "0"
        LMS_INSTALL_HOME: /root

  nvidia:
    profiles: ["nvidia"]
    <<: *llmster
    image: lmstudio-llmster:nvidia
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA: "1"
        LMS_INSTALL_HOME: /root
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

  amd:
    profiles: ["amd"]
    <<: *llmster
    image: lmstudio-llmster:amd
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA: "0"
        LMS_INSTALL_HOME: /root
    devices:
      - /dev/kfd
      - /dev/dri

  intel:
    profiles: ["intel"]
    <<: *llmster
    image: lmstudio-llmster:intel
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA: "0"
        LMS_INSTALL_HOME: /root
    devices:
      - /dev/dri
