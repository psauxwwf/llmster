version: "3"

vars:
  docker_compose: docker compose --project-directory . -f docker/docker-compose.yaml

tasks:
  prepare:
    desc: create local lmstudio data directories
    silent: true
    cmds:
      - mkdir -p ./data/models ./data/extensions ./data/internal
      - test -w ./data/models
      - test -w ./data/extensions
      - test -w ./data/internal

  build:profile:
    internal: true
    silent: true
    requires:
      vars: [override]
    cmds:
      - "{{.docker_compose}} -f {{.override}} build llmster"

  push:profile:
    internal: true
    silent: true
    requires:
      vars: [override]
    cmds:
      - "{{.docker_compose}} -f {{.override}} push llmster"

  pull:profile:
    internal: true
    silent: true
    requires:
      vars: [override]
    cmds:
      - "{{.docker_compose}} -f {{.override}} pull llmster"

  up:profile:
    internal: true
    silent: true
    requires:
      vars: [override]
    deps:
      - task: prepare
    cmds:
      - "{{.docker_compose}} -f {{.override}} up --build llmster"

  build:cpu:
    desc: build cpu image
    silent: true
    cmds:
      - "{{.docker_compose}} build llmster"

  build:nvidia:
    desc: build nvidia image
    silent: true
    cmds:
      - task: build:profile
        vars:
          override: docker/docker-compose.nvidia.yaml

  build:amd:
    desc: build amd image
    silent: true
    cmds:
      - task: build:profile
        vars:
          override: docker/docker-compose.amd.yaml

  build:intel:
    desc: build intel image
    silent: true
    cmds:
      - task: build:profile
        vars:
          override: docker/docker-compose.intel.yaml

  build:
    desc: build all images
    silent: true
    cmds:
      - task: build:nvidia
      - task: build:amd
      - task: build:intel
      - task: build:cpu

  push:
    desc: push all images
    silent: true
    cmds:
      - "{{.docker_compose}} push llmster"
      - task: push:profile
        vars:
          override: docker/docker-compose.nvidia.yaml
      - task: push:profile
        vars:
          override: docker/docker-compose.amd.yaml
      - task: push:profile
        vars:
          override: docker/docker-compose.intel.yaml

  pull:
    desc: pull all images
    silent: true
    cmds:
      - task: pull:profile
        vars:
          override: docker/docker-compose.nvidia.yaml
      - task: pull:profile
        vars:
          override: docker/docker-compose.amd.yaml
      - task: pull:profile
        vars:
          override: docker/docker-compose.intel.yaml
      - "{{.docker_compose}} pull llmster"

  up:cpu:
    desc: start cpu runtime
    silent: true
    deps:
      - task: prepare
    cmds:
      - "{{.docker_compose}} up --build -d llmster"

  up:nvidia:
    desc: start nvidia runtime
    silent: true
    cmds:
      - task: up:profile
        vars:
          override: docker/docker-compose.nvidia.yaml

  up:amd:
    desc: start amd runtime
    silent: true
    cmds:
      - task: up:profile
        vars:
          override: docker/docker-compose.amd.yaml

  up:intel:
    desc: start intel runtime
    silent: true
    cmds:
      - task: up:profile
        vars:
          override: docker/docker-compose.intel.yaml

  down:
    desc: stop and remove compose resources
    silent: true
    cmds:
      - "{{.docker_compose}} down --remove-orphans"

  logs:
    desc: show llmster logs
    silent: true
    cmds:
      - "{{.docker_compose}} logs -f llmster"

  release:
    desc: build, create git tag, gh release, and push versioned images
    vars:
      VERSION:
        sh: grep 'APP_VERSION=' install.sh | cut -d'"' -f2
    cmds:
      - task: build
      - git tag "v{{.VERSION}}" 2>/dev/null || echo "Tag v{{.VERSION}} already exists"
      - git push origin "v{{.VERSION}}" 2>/dev/null || echo "Tag v{{.VERSION}} already on remote"
      - gh release view "v{{.VERSION}}" >/dev/null 2>&1 || gh release create "v{{.VERSION}}" --generate-notes
      - task: tag:profile
        vars: { variant: cpu, VERSION: "{{.VERSION}}" }
      - task: tag:profile
        vars: { variant: nvidia, VERSION: "{{.VERSION}}" }
      - task: tag:profile
        vars: { variant: amd, VERSION: "{{.VERSION}}" }
      - task: tag:profile
        vars: { variant: intel, VERSION: "{{.VERSION}}" }

  tag:profile:
    internal: true
    silent: true
    requires:
      vars: [variant, VERSION]
    cmds:
      - docker tag ghcr.io/psauxwwf/llmster:{{.variant}} ghcr.io/psauxwwf/llmster:{{.VERSION}}-{{.variant}}
      - docker push ghcr.io/psauxwwf/llmster:{{.variant}}
      - docker push ghcr.io/psauxwwf/llmster:{{.VERSION}}-{{.variant}}
