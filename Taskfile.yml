version: "3"

tasks:
  build:cpu:
    desc: build cpu image
    silent: true
    cmds:
      - docker compose --profile cpu build llmster

  build:nvidia:
    desc: build nvidia image
    silent: true
    cmds:
      - docker compose --profile nvidia build nvidia

  build:amd:
    desc: build amd image
    silent: true
    cmds:
      - docker compose --profile amd build amd

  build:intel:
    desc: build intel image
    silent: true
    cmds:
      - docker compose --profile intel build intel

  build:
    desc: build all images
    silent: true
    cmds:
      - task: build:cpu
      - task: build:nvidia
      - task: build:amd
      - task: build:intel

  up:cpu:
    desc: start cpu profile
    silent: true
    cmds:
      - docker compose --profile cpu up --build -d llmster

  up:nvidia:
    desc: start nvidia profile
    silent: true
    cmds:
      - docker compose --profile nvidia up --build -d nvidia

  up:amd:
    desc: start amd profile
    silent: true
    cmds:
      - docker compose --profile amd up --build -d amd

  up:intel:
    desc: start intel profile
    silent: true
    cmds:
      - docker compose --profile intel up --build -d intel

  down:
    desc: stop and remove compose resources
    silent: true
    cmds:
      - docker compose down

  logs:
    desc: show llmster logs
    silent: true
    cmds:
      - docker compose logs -f
