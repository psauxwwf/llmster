---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

dotenv: [".env"]

vars:
  DOCKER_COMPOSE: docker compose --project-directory . -f docker/docker-compose.yaml
  IMAGE_REPO: ghcr.io/psauxwwf/llmster
  CPU_IMAGE: "{{.IMAGE_REPO}}:cpu"
  NVIDIA_IMAGE: "{{.IMAGE_REPO}}:nvidia"
  AMD_IMAGE: "{{.IMAGE_REPO}}:amd"
  INTEL_IMAGE: "{{.IMAGE_REPO}}:intel"

env:
  COMPOSE_BAKE: true

tasks:
  prepare:
    desc: Create local LM Studio data directories.
    silent: true
    cmds:
      - mkdir -p ./data/models ./data/extensions ./data/internal
      - test -w ./data/models
      - test -w ./data/extensions
      - test -w ./data/internal

  image:build:profile:
    internal: true
    silent: true
    requires:
      vars: [override]
    cmds:
      - "{{.DOCKER_COMPOSE}} -f {{.override}} build llmster"

  image:push:profile:
    internal: true
    silent: true
    requires:
      vars: [override]
    cmds:
      - "{{.DOCKER_COMPOSE}} -f {{.override}} push llmster"

  image:pull:profile:
    internal: true
    silent: true
    requires:
      vars: [override]
    cmds:
      - "{{.DOCKER_COMPOSE}} -f {{.override}} pull llmster"

  image:publish:profile:
    internal: true
    silent: true
    requires:
      vars: [variant, VERSION]
    cmds:
      - docker image tag {{.IMAGE_REPO}}:{{.variant}} {{.IMAGE_REPO}}:{{.VERSION}}-{{.variant}}
      - docker push {{.IMAGE_REPO}}:{{.variant}}
      - docker push {{.IMAGE_REPO}}:{{.VERSION}}-{{.variant}}

  up:profile:
    internal: true
    silent: true
    requires:
      vars: [override]
    deps:
      - task: prepare
    cmds:
      - "{{.DOCKER_COMPOSE}} -f {{.override}} up --build llmster"

  image:build:cpu:
    desc: Build the CPU Docker image.
    silent: true
    cmds:
      - "{{.DOCKER_COMPOSE}} build llmster"

  image:build:nvidia:
    desc: Build the NVIDIA Docker image.
    silent: true
    cmds:
      - task: image:build:profile
        vars:
          override: docker/docker-compose.nvidia.yaml

  image:build:amd:
    desc: Build the AMD Docker image.
    silent: true
    cmds:
      - task: image:build:profile
        vars:
          override: docker/docker-compose.amd.yaml

  image:build:intel:
    desc: Build the Intel Docker image.
    silent: true
    cmds:
      - task: image:build:profile
        vars:
          override: docker/docker-compose.intel.yaml

  image:build:
    desc: Build Docker images for all hardware variants.
    silent: true
    cmds:
      - task: image:build:cpu
      - task: image:build:nvidia
      - task: image:build:amd
      - task: image:build:intel

  image:push:
    desc: Build and push Docker images for all hardware variants.
    silent: true
    cmds:
      - task: image:build
      - "{{.DOCKER_COMPOSE}} push llmster"
      - task: image:push:profile
        vars:
          override: docker/docker-compose.nvidia.yaml
      - task: image:push:profile
        vars:
          override: docker/docker-compose.amd.yaml
      - task: image:push:profile
        vars:
          override: docker/docker-compose.intel.yaml

  image:pull:
    desc: Pull published images for all hardware variants.
    silent: true
    cmds:
      - "{{.DOCKER_COMPOSE}} pull llmster"
      - task: image:pull:profile
        vars:
          override: docker/docker-compose.nvidia.yaml
      - task: image:pull:profile
        vars:
          override: docker/docker-compose.amd.yaml
      - task: image:pull:profile
        vars:
          override: docker/docker-compose.intel.yaml

  image:publish:
    desc: Build, tag, and push Docker images for all hardware variants.
    preconditions:
      - sh: test -n "${LMS_VERSION:-}"
        msg: LMS_VERSION is required, e.g. LMS_VERSION=0.0.15-2 task image:publish
    vars:
      VERSION: "{{.LMS_VERSION}}"
    cmds:
      - task: image:pull
      - task: image:build
      - task: image:publish:profile
        vars: { variant: cpu, VERSION: "{{.VERSION}}" }
      - task: image:publish:profile
        vars: { variant: nvidia, VERSION: "{{.VERSION}}" }
      - task: image:publish:profile
        vars: { variant: amd, VERSION: "{{.VERSION}}" }
      - task: image:publish:profile
        vars: { variant: intel, VERSION: "{{.VERSION}}" }

  release:create:
    desc: Create a GitHub Release for the requested version.
    preconditions:
      - sh: test -n "${LMS_VERSION:-}"
        msg: LMS_VERSION is required, e.g. LMS_VERSION=0.0.15-2 task release:create
    vars:
      VERSION: "{{.LMS_VERSION}}"
    cmds:
      - >-
        gh release create "v{{.VERSION}}" --target "$(git rev-parse HEAD)" --title "v{{.VERSION}}" --generate-notes

  up:cpu:
    desc: Start the CPU container.
    silent: true
    deps:
      - task: prepare
    cmds:
      - "{{.DOCKER_COMPOSE}} up --build llmster"

  up:nvidia:
    desc: Start the NVIDIA container.
    silent: true
    cmds:
      - task: up:profile
        vars:
          override: docker/docker-compose.nvidia.yaml

  up:amd:
    desc: Start the AMD container.
    silent: true
    cmds:
      - task: up:profile
        vars:
          override: docker/docker-compose.amd.yaml

  up:intel:
    desc: Start the Intel container.
    silent: true
    cmds:
      - task: up:profile
        vars:
          override: docker/docker-compose.intel.yaml
