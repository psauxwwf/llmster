name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "llmster version to build and release (e.g. 0.0.15-2)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Set build version
        run: |
          printf 'LMS_VERSION=%s\n' '${{ inputs.version }}' > .env

      - name: Build images
        run: task build

      - name: Tag and push images
        run: |
          for variant in cpu nvidia amd intel; do
            docker image tag ghcr.io/psauxwwf/llmster:${variant} ghcr.io/psauxwwf/llmster:${{ inputs.version }}-${variant}
            docker push ghcr.io/psauxwwf/llmster:${variant}
            docker push ghcr.io/psauxwwf/llmster:${{ inputs.version }}-${variant}
          done

      - uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: llmster ${{ inputs.version }}
